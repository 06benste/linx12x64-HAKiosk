# Home Assistant package — HA Kiosk Tablet (REST fallback)
# Copy to: /config/packages/hakiosk.yaml  (enable packages in configuration.yaml)
# Prefer MQTT discovery when possible — that creates a proper Device page.
#
# configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# AUTH: power-api.py requires a token for any caller that isn't the tablet
# itself (07-power-drawer.sh generates one at /opt/ha-kiosk/api.token on
# install — `ssh kioskuser@<tablet> cat /opt/ha-kiosk/api.token`). Add it to
# HA's secrets.yaml as the full header value (not just the token — !secret
# replaces the whole value it's assigned to, it can't be spliced into a
# larger string):
#   hakiosk_auth_header: "Bearer PASTE_TOKEN_HERE"

rest:
  - resource: http://192.168.8.201:17823/status
    scan_interval: 15
    timeout: 8
    headers:
      Authorization: !secret hakiosk_auth_header
    sensor:
      - name: "Kiosk Hostname"
        unique_id: hakiosk_hostname_rest
        value_template: "{{ value_json.hostname }}"
        icon: mdi:tablet
      - name: "Kiosk IP"
        unique_id: hakiosk_ip_rest
        value_template: "{{ value_json.wifi.ip }}"
        icon: mdi:ip-network
      - name: "Kiosk WiFi SSID"
        unique_id: hakiosk_ssid_rest
        value_template: "{{ value_json.wifi.ssid }}"
        icon: mdi:wifi
      - name: "Kiosk WiFi Signal"
        unique_id: hakiosk_signal_rest
        value_template: "{{ value_json.wifi.signal }}"
        unit_of_measurement: "%"
        icon: mdi:wifi-strength-3
      - name: "Kiosk WiFi Quality"
        unique_id: hakiosk_wifi_quality_rest
        value_template: "{{ value_json.wifi.quality }}"
        icon: mdi:wifi-star
      - name: "Kiosk WiFi Level"
        unique_id: hakiosk_wifi_level_rest
        value_template: "{{ value_json.wifi.level_dbm }}"
        unit_of_measurement: "dBm"
        icon: mdi:wifi
      - name: "Kiosk CPU Temperature"
        unique_id: hakiosk_cpu_temp_rest
        value_template: "{{ value_json.thermal.cpu_c }}"
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer
      - name: "Kiosk SoC Temperature"
        unique_id: hakiosk_soc_temp_rest
        value_template: "{{ value_json.thermal.soc_c }}"
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:chip
      - name: "Kiosk Disk Used"
        unique_id: hakiosk_disk_used_rest
        value_template: "{{ value_json.disk.used_percent }}"
        unit_of_measurement: "%"
        icon: mdi:harddisk
      - name: "Kiosk Disk Free"
        unique_id: hakiosk_disk_free_rest
        value_template: "{{ value_json.disk.free_gb }}"
        unit_of_measurement: "GB"
        icon: mdi:harddisk
      - name: "Kiosk Uptime"
        unique_id: hakiosk_uptime_rest
        value_template: "{{ value_json.uptime.seconds | int }}"
        unit_of_measurement: "s"
        device_class: duration
        icon: mdi:timer-outline
      - name: "Kiosk Load"
        unique_id: hakiosk_load_rest
        value_template: "{{ value_json.uptime.load[0] }}"
        icon: mdi:chip
      - name: "Kiosk Memory Used"
        unique_id: hakiosk_mem_rest
        value_template: "{{ value_json.uptime.memory.used_pct }}"
        unit_of_measurement: "%"
        icon: mdi:memory
      - name: "Kiosk Brightness"
        unique_id: hakiosk_brightness_rest
        value_template: "{{ value_json.brightness.percent }}"
        unit_of_measurement: "%"
        icon: mdi:brightness-6
      - name: "Kiosk Rotation"
        unique_id: hakiosk_rotation_rest
        value_template: "{{ value_json.rotation }}"
        icon: mdi:screen-rotation
      - name: "Kiosk Battery"
        unique_id: hakiosk_battery_rest
        value_template: "{{ value_json.power.battery_percent }}"
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:battery
      - name: "Kiosk Battery Status"
        unique_id: hakiosk_batt_status_rest
        value_template: "{{ value_json.power.battery_status }}"
        icon: mdi:battery-heart-variant
    binary_sensor:
      - name: "Kiosk HA Reachable"
        unique_id: hakiosk_ha_reach_rest
        value_template: "{{ value_json.ha.ok }}"
        device_class: connectivity
      - name: "Kiosk Plugged In"
        unique_id: hakiosk_plugged_rest
        value_template: "{{ value_json.power.plugged_in }}"
        device_class: plug
      - name: "Kiosk Charging"
        unique_id: hakiosk_charging_rest
        value_template: "{{ value_json.power.charging }}"
        device_class: battery_charging

rest_command:
  kiosk_reboot:
    url: "http://192.168.8.201:17823/reboot"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_shutdown:
    url: "http://192.168.8.201:17823/shutdown"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_blank:
    url: "http://192.168.8.201:17823/display-off"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_wake:
    url: "http://192.168.8.201:17823/display-on"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_refresh:
    url: "http://192.168.8.201:17823/refresh"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_restart_display:
    url: "http://192.168.8.201:17823/chromium-restart"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_night_on:
    url: "http://192.168.8.201:17823/night-on"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_night_off:
    url: "http://192.168.8.201:17823/night-off"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: "{}"
  kiosk_brightness:
    url: "http://192.168.8.201:17823/brightness"
    method: POST
    content_type: "application/json"
    headers:
      Authorization: !secret hakiosk_auth_header
    payload: '{"percent": {{ percent }}}'

input_number:
  kiosk_brightness:
    name: Kiosk Brightness Control
    min: 5
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:brightness-6
    mode: slider

button:
  - unique_id: hakiosk_btn_reboot
    name: Kiosk Restart Tablet
    icon: mdi:restart
  - unique_id: hakiosk_btn_blank
    name: Kiosk Blank Display
    icon: mdi:monitor-off
  - unique_id: hakiosk_btn_wake
    name: Kiosk Wake Display
    icon: mdi:monitor
  - unique_id: hakiosk_btn_refresh
    name: Kiosk Refresh Dashboard
    icon: mdi:refresh
  - unique_id: hakiosk_btn_restart_display
    name: Kiosk Restart Display
    icon: mdi:monitor-screenshot
  - unique_id: hakiosk_btn_night
    name: Kiosk Night Mode
    icon: mdi:weather-night
  - unique_id: hakiosk_btn_day
    name: Kiosk Day Mode
    icon: mdi:white-balance-sunny

automation:
  - id: hakiosk_brightness_slider
    alias: Kiosk brightness slider
    trigger:
      - platform: state
        entity_id: input_number.kiosk_brightness
    action:
      - service: rest_command.kiosk_brightness
        data:
          percent: "{{ states('input_number.kiosk_brightness') | int }}"
  - id: hakiosk_btn_reboot
    alias: Kiosk button reboot
    trigger:
      - platform: state
        entity_id: button.kiosk_restart_tablet
    action:
      - service: rest_command.kiosk_reboot
  - id: hakiosk_btn_blank
    alias: Kiosk button blank
    trigger:
      - platform: state
        entity_id: button.kiosk_blank_display
    action:
      - service: rest_command.kiosk_blank
  - id: hakiosk_btn_wake
    alias: Kiosk button wake
    trigger:
      - platform: state
        entity_id: button.kiosk_wake_display
    action:
      - service: rest_command.kiosk_wake
  - id: hakiosk_btn_refresh
    alias: Kiosk button refresh
    trigger:
      - platform: state
        entity_id: button.kiosk_refresh_dashboard
    action:
      - service: rest_command.kiosk_refresh
  - id: hakiosk_btn_restart_display
    alias: Kiosk button restart display
    trigger:
      - platform: state
        entity_id: button.kiosk_restart_display
    action:
      - service: rest_command.kiosk_restart_display
  - id: hakiosk_btn_night
    alias: Kiosk button night
    trigger:
      - platform: state
        entity_id: button.kiosk_night_mode
    action:
      - service: rest_command.kiosk_night_on
  - id: hakiosk_btn_day
    alias: Kiosk button day
    trigger:
      - platform: state
        entity_id: button.kiosk_day_mode
    action:
      - service: rest_command.kiosk_night_off
