label expert
	menu label E^xpert install
	kernel /install.amd/vmlinuz
	append priority=low vga=788 initrd=/install.amd/initrd.gz --- intel_idle.max_cstate=1 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 i915.enable_rc6=0 nomodeset
include rqtxt.cfg
label auto
	menu label ^Automated install
	kernel /install.amd/vmlinuz
	append auto=true priority=critical vga=788 initrd=/install.amd/initrd.gz --- quiet intel_idle.max_cstate=1 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 i915.enable_rc6=0 nomodeset
