menu hshift 9
menu width 58

label expertgui
	menu label Graphical expert install
	kernel /install.amd/vmlinuz
	append priority=low vga=788 initrd=/install.amd/gtk/initrd.gz --- intel_idle.max_cstate=1 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 i915.enable_rc6=0 nomodeset
include rqgtk.cfg
label autogui
	menu label Graphical automated install
	kernel /install.amd/vmlinuz
	append auto=true priority=critical vga=788 initrd=/install.amd/gtk/initrd.gz --- quiet intel_idle.max_cstate=1 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 i915.enable_rc6=0 nomodeset
